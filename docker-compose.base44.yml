services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - pg_react_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    restart: unless-stopped

volumes:
  pg_react_node_modules:
